<!DOCTYPE html>
<html lang="en">

<head>

  <!-- Basic Meta -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Page Title -->
<title>Admin Login | Sir Syed Hassan Ali Coaching</title>

<!-- Main CSS -->
<link rel="stylesheet" href="css/style.css">

<!-- Admin Login CSS -->
<link rel="stylesheet" href="css/admin-login.css">

<!-- Font Awesome Icons -->
<link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<!-- ==========================================
     LOGIN SECTION
========================================== -->

<section class="login-section">

    <!-- Login Card -->
    <div class="login-card">

        <!-- Logo -->
        <div class="login-logo">

            <img src="assets/logo.png"
                alt="Sir Syed Hassan Ali Coaching">

        </div>

        <!-- Coaching Name -->
        <h1 class="coaching-name">
            Sir Syed Hassan Ali
        </h1>

        <p class="coaching-subtitle">
            Coaching Management System
        </p>

        <!-- Login Title -->
        <h2 class="login-title">
            Admin Login
        </h2>

        <!-- Login Form -->
        <form id="loginForm">

            <!-- Email -->
            <div class="input-group">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    required>

            </div>

            <!-- Password -->
            <div class="input-group">

                <label for="password">Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required>

                    <button
                        type="button"
                        id="togglePassword"
                        aria-label="Show or hide password">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>

            <!-- Remember -->
            <div class="remember-area">

                <label>
                    <input
                        type="checkbox"
                        id="remember">
                    Remember Me
                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>

            <!-- Error -->
            <p id="loginError"></p>

            <!-- Login Button -->
            <button
                class="login-btn"
                type="submit">

                Login

            </button>

        </form>

    </div>

</section>


<!-- JS -->
<script type="module"
    src="javascript/admin-login.js"></script>

</body>

</html>
