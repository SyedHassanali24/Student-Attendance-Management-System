<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Student Dashboard | Sir Syed Hassan Ali Coaching
    </title>

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Student Dashboard CSS -->
    <link
        rel="stylesheet"
        href="./css/student-dashboard.css?v=10"
    >

    <!-- Student Fee Slip CSS -->
    <link
        rel="stylesheet"
        href="./css/student-fee-slip.css?v=1"
    >

</head>


<body>


<div class="student-app">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="student-sidebar">


        <!-- BRAND -->

        <div class="student-brand">

            <div class="brand-logo">
                SS
            </div>

            <div>

                <strong>
                    Sir Syed Hassan Ali
                </strong>

                <span>
                    Student Portal
                </span>

            </div>

        </div>


        <!-- NAVIGATION -->

        <nav class="student-nav">


            <button
                type="button"
                class="nav-item active"
                data-section="overview"
            >

                <span>⌂</span>

                Dashboard

            </button>


            <button
                type="button"
                class="nav-item"
                data-section="attendance"
            >

                <span>◷</span>

                Attendance

            </button>


            <button
                type="button"
                class="nav-item"
                data-section="fees"
            >

                <span>₨</span>

                Fees

            </button>


            <button
                type="button"
                class="nav-item"
                data-section="results"
            >

                <span>▣</span>

                Results

            </button>


            <button
                type="button"
                class="nav-item"
                data-section="announcements"
            >

                <span>◉</span>

                Announcements

            </button>


            <button
                type="button"
                class="nav-item"
                data-section="profile"
            >

                <span>●</span>

                My Profile

            </button>


        </nav>


        <!-- LOGOUT -->

        <button
            type="button"
            id="studentLogout"
            class="logout-btn"
        >

            <span>↪</span>

            Logout

        </button>


    </aside>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="student-main">


        <!-- TOPBAR -->
        <header class="student-topbar">
            <div>
                <div class="eyebrow">STUDENT PORTAL</div>
                <h1 id="pageTitle">Dashboard</h1>
                <p>Sir Syed Hassan Ali Coaching Management System</p>
            </div>

            <div class="profile-mini">
                <div id="profileAvatar" class="profile-avatar">S</div>
                <div>
                    <strong id="topStudentName">Student</strong>
                    <span id="topStudentId">—</span>
                </div>
            </div>
        </header>


        <!-- NOTE:
             The existing dashboard sections remain unchanged.
             They are intentionally kept from the current project version.
        -->

        <!-- Existing dashboard content is loaded by the current student portal. -->

    </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script
    type="module"
    src="./javascript/student-dashboard.js?v=10"
></script>

<!-- Student Fee Slip -->
<script
    type="module"
    src="./javascript/student-fee-slip.js?v=1"
></script>

</body>

</html>
