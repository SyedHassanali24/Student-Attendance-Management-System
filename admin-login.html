<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Sir Syed Hassan Ali Coaching</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <section class="login-section">
        <div class="login-card">
            <div class="login-logo">
                <img src="assets/logo.png" alt="Sir Syed Hassan Ali Coaching">
            </div>

            <h1 class="coaching-name">Sir Syed Hassan Ali</h1>
            <p class="coaching-subtitle">Coaching Management System</p>
            <h2 class="login-title">Admin Login</h2>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter admin email" autocomplete="email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-box">
                        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
                        <button type="button" id="togglePassword" aria-label="Show or hide password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="remember-area">
                    <label>
                        <input type="checkbox" id="remember">
                        Remember Me
                    </label>
                    <a href="#" id="forgotPasswordLink">Forgot Password?</a>
                </div>

                <p id="loginError" aria-live="polite"></p>

                <button class="login-btn" type="submit" id="loginButton">Login</button>
            </form>
        </div>
    </section>

    <script type="module" src="javascript/admin-login.js?v=3"></script>
</body>
</html>
