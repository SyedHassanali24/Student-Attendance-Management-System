<!-- ==========================================
     LOGIN CARD
========================================== -->

<div class="login-card">

    <!-- Logo -->
    <div class="login-logo">

        <img src="assets/logo.png"
             alt="Sir Syed Hassan Ali Coaching">

    </div>

    <!-- Coaching Name -->
    <h1 class="coaching-name">
        Sir Syed Hassan Ali
    </h1>

    <p class="coaching-subtitle">
        Coaching Management System
    </p>

    <!-- Login Title -->
    <h2 class="login-title">
        Admin Login
    </h2>

    <!-- Login Form -->
    <form id="loginForm">

        <!-- Email -->
        <div class="input-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                autocomplete="email"
                required>

        </div>

        <!-- Password -->
        <div class="input-group">

            <label for="password">
                Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required>

                <button
                    type="button"
                    id="togglePassword"
                    aria-label="Show or hide password">

                    <i class="fa-solid fa-eye"></i>

                </button>

            </div>

        </div>

        <!-- Remember Me -->
        <div class="remember-area">

            <label>

                <input
                    type="checkbox"
                    id="remember">

                Remember Me

            </label>

            <a href="#">
                Forgot Password?
            </a>

        </div>

        <!-- Error Message -->
        <p id="loginError"></p>

        <!-- Login Button -->
        <button
            class="login-btn"
            type="submit">

            Login

        </button>

    </form>

</div>

<!-- ==========================================
     JAVASCRIPT
========================================== -->

<script type="module"
        src="javascript/admin-login.js"></script>
